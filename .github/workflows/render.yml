name: Render episode video

on:
  repository_dispatch:
    types: [render-request]
  workflow_dispatch:
    inputs:
      payload:
        description: "Full render payload JSON"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || inputs.payload }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Static FFmpeg build (ffmpeg was removed from ubuntu-24.04 runner images; apt hangs)
      - name: Set up FFmpeg
        run: |
          curl -sSL https://www.johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz
          mkdir -p /tmp/ffmpegx
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpegx --strip-components=1
          sudo cp /tmp/ffmpegx/ffmpeg /tmp/ffmpegx/ffprobe /usr/local/bin/
          ffmpeg -version | head -1

      - name: Render and upload
        env:
          RENDER_UPLOAD_SECRET: ${{ secrets.RENDER_UPLOAD_SECRET }}
        run: node render/render.mjs
