name: Render episode video

on:
  repository_dispatch:
    types: [render-request]
  workflow_dispatch:
    inputs:
      payload:
        description: "Full render payload JSON"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || inputs.payload }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Render and upload
        run: node render/render.mjs
