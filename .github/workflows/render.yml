name: Render episode video

on:
  repository_dispatch:
    types: [render-request]
  workflow_dispatch:
    inputs:
      payload:
        description: "Full render payload JSON"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || inputs.payload }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ffmpeg is preinstalled on ubuntu-latest — no install step (apt hangs caused 25+ min delays)
      - name: Render and upload
        env:
          RENDER_UPLOAD_SECRET: ${{ secrets.RENDER_UPLOAD_SECRET }}
        run: node render/render.mjs
